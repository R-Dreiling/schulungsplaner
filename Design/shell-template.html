<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<title>Schulungsplaner – Dashboard</title>
<style>
{{BASE_CSS}}

/* ---- Seitenspezifisches CSS (von den Seiten-Fragmenten, optional) ---- */
{{PAGE_CSS}}

/* ---- Bildschirmdarstellung: die App fuellt das Fenster ----
   Frueher stand hier ein Vorschaurahmen mit fester Groesse (1360x860, mittig
   auf grauem Grund). Im taeglichen Betrieb soll die App den Bildschirm nutzen
   wie jedes andere Programm. Bewusst nur fuer den Bildschirm: diese Regeln
   stehen nach dem eingefuegten Basis-CSS und wuerden den @media-print-Block
   in styles.css sonst ueberstimmen. */
@media screen {
  body { margin: 0; padding: 0; background: var(--bg); min-height: 100vh; }
  .app-window { width: 100%; height: 100vh; border-radius: 0; box-shadow: none; }
}
</style>
</head>
<body>

<div class="app-window">
  <div class="titlebar">
    <img class="logo" src="data:image/svg+xml;base64,{{LOGO_B64}}" alt="tribeta" />
    <span class="app-name">Schulungsplaner</span>
  </div>
  <div class="app-body">
    <nav class="sidebar">
      <div class="sidebar-nav">
        <button class="sidebar-nav-item active" data-nav="uebersicht" onclick="showPage('uebersicht')">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
          Übersicht
        </button>
        <button class="sidebar-nav-item" data-nav="schulungen" onclick="showPage('schulungen')">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5.5A2.5 2.5 0 0 1 5.5 3H20v15H5.5A2.5 2.5 0 0 0 3 20.5z"/><path d="M3 5.5A2.5 2.5 0 0 0 5.5 8H20"/></svg>
          Schulungen
        </button>
        <button class="sidebar-nav-item" data-nav="buchungen" onclick="showPage('buchungen')">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5A1.5 1.5 0 0 1 7.5 2h9A1.5 1.5 0 0 1 18 3.5V21l-6-4-6 4z"/></svg>
          Buchungen
        </button>
        <button class="sidebar-nav-item" data-nav="trainer" onclick="showPage('trainer')">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c0-4 3.4-6.6 7.5-6.6s7.5 2.6 7.5 6.6"/></svg>
          Trainer
        </button>
        <button class="sidebar-nav-item" data-nav="hilfe" onclick="showPage('hilfe')" style="margin-top:10px;">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.2a2.5 2.5 0 0 1 4.8.9c0 1.7-2.4 2.2-2.4 3.9"/><path d="M12 17.4h.01"/></svg>
          Hilfe
        </button>
      </div>
      <div class="sidebar-footer">
        <div class="sidebar-tools">
          <button class="sidebar-tool-btn" onclick="oeffneEinstellungenDialog()">Unterschrift &amp; Stempel</button>
          <button class="sidebar-tool-btn" id="werkzeug-export" onclick="exportiereJSON()">Exportieren</button>
          <div id="sicherungshinweis" class="sicherungshinweis" style="display:none"></div>
          <button class="sidebar-tool-btn" onclick="document.getElementById('import-input').click()">Importieren</button>
          <button class="sidebar-tool-btn" onclick="zuruecksetzenAufBeispieldaten()">Zurücksetzen</button>
          <button class="sidebar-tool-btn" onclick="alleDatenLeeren()">Alle Daten leeren</button>
          <input type="file" id="import-input" accept="application/json" style="display:none" />
        </div>
        Schulungsplaner<br/>Lokal gespeichert im Browser
      </div>
    </nav>

    <main class="main">
      <section id="page-uebersicht" class="page active">
{{PAGE_UEBERSICHT}}
      </section>

      <section id="page-schulungen" class="page">
{{PAGE_SCHULUNGEN}}
      </section>

      <section id="page-schulungdetail" class="page">
{{PAGE_SCHULUNGDETAIL}}
      </section>

      <section id="page-buchungen" class="page">
{{PAGE_BUCHUNGEN}}
      </section>

      <section id="page-trainer" class="page">
{{PAGE_TRAINER}}
      </section>

      <section id="page-hilfe" class="page">
{{PAGE_HILFE}}
      </section>
    </main>
  </div>
</div>

<div id="dialog-overlay" class="dialog-overlay" style="display:none">
  <div id="dialog-container" class="dialog"></div>
</div>

<!-- Wird nur beim Drucken sichtbar (siehe @media print in styles.css) und
     vorher per druckeInhalt() befuellt. So entstehen Bescheinigung und
     Abschlussbericht ohne zweites Fenster und ohne Zusatzbibliothek. -->
<div id="druck-bereich"></div>

<script>
window.SEED_DATA = {{DATA_JSON}};
</script>
<script>
{{CORE_JS}}
</script>
<script>
{{PAGE_JS}}
</script>
<script>
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + id).classList.add('active');
  document.querySelectorAll('.sidebar-nav-item').forEach(b => b.classList.remove('active'));
  var navBtn = document.querySelector('.sidebar-nav-item[data-nav="' + id + '"]');
  if (navBtn) navBtn.classList.add('active');
  document.querySelector('.main').scrollTop = 0;
}

// Von der Schulungen-Liste aufgerufen: navigiert zur Detailseite und rendert
// den passenden Termin (terminId, nicht kursId).
function showSchulungDetail(terminId) {
  window.AKTUELLER_TERMIN_ID = terminId;
  showPage('schulungdetail');
  if (typeof renderSchulungdetail === 'function') {
    renderSchulungdetail(terminId);
  }
}

// Von der Trainer-Liste aufgerufen: wechselt auf die Trainer-Seite und
// zeigt die Detailansicht dieser Person.
function showTrainerDetail(trainerId) {
  window.AKTUELLER_TRAINER_ID = trainerId;
  showPage('trainer');
  if (typeof renderTrainer === 'function') {
    renderTrainer(trainerId);
  }
}

window.LOGO_NORMAL = 'data:image/svg+xml;base64,{{LOGO_NORMAL_B64}}';
window.LOGO_ICON = 'data:image/svg+xml;base64,{{LOGO_ICON_B64}}';
window.STEMPEL_VORLAGE = 'data:image/svg+xml;base64,{{STEMPEL_B64}}';

// Fuellt den Druckbereich und loest den Browser-Druckdialog aus. Der
// Dokumenttitel bestimmt den vom Browser vorgeschlagenen Dateinamen beim
// "Als PDF speichern" und wird danach wieder zurueckgesetzt.
function druckeInhalt(html, dokumentTitel) {
  const bereich = document.getElementById('druck-bereich');
  bereich.innerHTML = html;
  const vorherigerTitel = document.title;
  document.title = dokumentTitel;
  window.print();
  document.title = vorherigerTitel;
}

document.getElementById('import-input').addEventListener('change', (ev) => {
  const datei = ev.target.files[0];
  if (!datei) return;
  importiereJSON(datei)
    .then(() => alert('Import erfolgreich.'))
    .catch(err => alert('Import fehlgeschlagen: ' + err.message));
  ev.target.value = '';
});

// Zeigt in der Werkzeugleiste an, wenn seit der letzten Sicherung genug
// passiert ist. Bewusst dezent und ohne Dialog - beim Schulungsabschluss
// fragt die App gezielt nach (siehe detailAbschlussSpeichern).
function renderSicherungshinweis() {
  const feld = document.getElementById('sicherungshinweis');
  if (!feld || typeof sicherungStand !== 'function') return;
  const s = sicherungStand();
  if (!s.faellig) { feld.style.display = 'none'; return; }
  const wann = s.letzteSicherung
    ? `zuletzt vor ${s.tageSeitSicherung} Tag(en)`
    : 'noch nie gesichert';
  feld.innerHTML = `Sicherung fällig · ${s.aenderungen} Änderung(en), ${wann}`;
  feld.style.display = 'block';
}

function renderAll() {
  renderSicherungshinweis();
  if (typeof renderUebersicht === 'function') renderUebersicht();
  if (typeof renderSchulungen === 'function') renderSchulungen();
  if (typeof renderSchulungdetail === 'function') renderSchulungdetail(window.AKTUELLER_TERMIN_ID);
  if (typeof renderBuchungen === 'function') renderBuchungen();
  if (typeof renderTrainer === 'function') renderTrainer(window.AKTUELLER_TRAINER_ID);
}
window.renderAll = renderAll;

// Status-Automatik laeuft genau einmal beim Laden - bewusst vor dem ersten
// Rendern und ausserhalb davon, damit das Rendern seiteneffektfrei bleibt.
if (typeof statusAutomatikAnwenden === 'function') {
  statusAutomatikAnwenden();
}

renderAll();

// Ist ein Ablageordner eingerichtet, ist die Datei dort der gemeinsame Stand.
// Sie wird nach dem ersten Zeichnen geladen (der Zugriff ist asynchron und
// braucht ggf. eine Bestaetigung) und ersetzt dann die lokale Kopie.
if (typeof ablageBeimStartLaden === 'function') {
  ablageBeimStartLaden().then(function (r) {
    if (r.geladen) {
      statusAutomatikAnwenden();
      renderAll();
      console.info('Gemeinsamer Datenbestand aus dem Ablageordner geladen.');
    }
  });
}

// Deep-Link ueber URL-Hash, z.B. index.html#schulungen oder index.html#detail-s1
(function () {
  var hash = location.hash.replace('#', '');
  if (!hash) return;
  if (hash.indexOf('detail-') === 0) {
    showSchulungDetail(hash.replace('detail-', ''));
  } else if (document.getElementById('page-' + hash)) {
    showPage(hash);
  }
})();
</script>
</body>
</html>
