<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<title>Schulungsplaner – Dashboard</title>
<style>
{{BASE_CSS}}

/* ---- Seitenspezifisches CSS (von den Seiten-Fragmenten) ---- */
{{PAGE_CSS}}

/* ---- Aussenrahmen fuer die Vorschau (die App selbst ist app-window) ---- */
body { display: flex; align-items: center; justify-content: center; padding: 18px; background: #e4e8f0; min-height: 100vh; }
.app-window { width: 1360px; max-width: 100%; height: 860px; }
</style>
</head>
<body>

<div class="app-window">
  <div class="titlebar">
    <div class="traffic-dots">
      <span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span>
    </div>
    <img class="logo" src="data:image/svg+xml;base64,{{LOGO_B64}}" alt="tribeta" />
    <span class="app-name">Schulungsplaner</span>
  </div>
  <div class="app-body">
    <nav class="sidebar">
      <div class="sidebar-nav">
        <button class="sidebar-nav-item active" data-nav="uebersicht" onclick="showPage('uebersicht')">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
          Übersicht
        </button>
        <button class="sidebar-nav-item" data-nav="schulungen" onclick="showPage('schulungen')">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5.5A2.5 2.5 0 0 1 5.5 3H20v15H5.5A2.5 2.5 0 0 0 3 20.5z"/><path d="M3 5.5A2.5 2.5 0 0 0 5.5 8H20"/></svg>
          Schulungen
        </button>
        <button class="sidebar-nav-item" data-nav="teilnehmer" onclick="showPage('teilnehmer')">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17.2" cy="8.5" r="2.6"/><path d="M15.8 14.2c2.9.3 4.9 2.3 4.9 5.3"/></svg>
          Teilnehmer
        </button>
        <button class="sidebar-nav-item" data-nav="kunden" onclick="showPage('kunden')">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="9" width="18" height="12" rx="1.5"/><path d="M8 9V6a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v3"/><path d="M3 13h18"/></svg>
          Kunden
        </button>
      </div>
      <div class="sidebar-footer">Schulungsplaner · Prototyp<br/>Beispieldaten, Q3 2026</div>
    </nav>

    <main class="main">
      <section id="page-uebersicht" class="page active">
{{PAGE_UEBERSICHT}}
      </section>

      <section id="page-schulungen" class="page">
{{PAGE_SCHULUNGEN}}
      </section>

      <section id="page-schulungdetail" class="page">
{{PAGE_SCHULUNGDETAIL}}
      </section>

      <section id="page-teilnehmer" class="page">
{{PAGE_TEILNEHMER}}
      </section>

      <section id="page-kunden" class="page">
{{PAGE_KUNDEN}}
      </section>
    </main>
  </div>
</div>

<script>
// Eingebettete Beispieldaten (verfuegbar als window.DATA, falls Seiten sie referenzieren)
window.DATA = {{DATA_JSON}};

function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + id).classList.add('active');
  document.querySelectorAll('.sidebar-nav-item').forEach(b => b.classList.remove('active'));
  var navBtn = document.querySelector('.sidebar-nav-item[data-nav="' + id + '"]');
  if (navBtn) navBtn.classList.add('active');
  document.querySelector('.main').scrollTop = 0;
}

// Von der Schulungen-Liste aufgerufen: navigiert zur Detailseite und zeigt
// das passende, vorgerenderte Detail-Panel (id="detail-<schulungId>").
function showSchulungDetail(id) {
  showPage('schulungdetail');
  document.querySelectorAll('.detail-panel').forEach(el => el.style.display = 'none');
  var target = document.getElementById('detail-' + id);
  if (target) target.style.display = 'block';
}

// Deep-Link ueber URL-Hash, z.B. index.html#schulungen oder index.html#detail-s3
(function () {
  var hash = location.hash.replace('#', '');
  if (!hash) return;
  if (hash.indexOf('detail-') === 0) {
    showSchulungDetail(hash.replace('detail-', ''));
  } else if (document.getElementById('page-' + hash)) {
    showPage(hash);
  }
})();
</script>
</body>
</html>
